name: Fix Kotlin String Escapes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix MainActivity.kt and HttpProxyServer.kt
        run: |
          python3 - << 'PYEOF'
          CR, LF, Q, BS = chr(13), chr(10), chr(34), chr(92)
          CRLF = CR + LF
          p1 = 'app/src/main/java/com/netshare/everyproxy/MainActivity.kt'
          s1 = open(p1, encoding='utf-8').read()
          s1 = s1.replace('.' + LF + Q, '.' + BS + 'n' + Q)
          s1 = s1.replace('joinToString(' + Q + LF + Q + ')', 'joinToString(' + Q + BS + 'n' + Q + ')')
          open(p1, 'w', encoding='utf-8').write(s1)

          p2 = 'app/src/main/java/com/netshare/everyproxy/HttpProxyServer.kt'
          s2 = open(p2, encoding='utf-8', newline='').read()
          for old, new in [
              ('headerText.split(' + Q + CRLF + Q + ')', 'headerText.split(' + Q + BS + 'r' + BS + 'n' + Q + ')'),
              ('return ' + Q + 'PROXY $lanIp:${config.httpPort}; DIRECT' + Q + '; }' + LF + Q, 'return ' + BS + Q + 'PROXY $lanIp:${config.httpPort}; DIRECT' + BS + Q + '; }' + BS + 'n' + Q),
              (Q + 'HTTP/1.1 200 OK' + CRLF + Q, Q + 'HTTP/1.1 200 OK' + BS + 'r' + BS + 'n' + Q),
              (Q + 'Content-Type: application/x-ns-proxy-autoconfig' + CRLF + Q, Q + 'Content-Type: application/x-ns-proxy-autoconfig' + BS + 'r' + BS + 'n' + Q),
              (Q + 'Content-Length: ${pacBody.toByteArray().size}' + CRLF + Q, Q + 'Content-Length: ${pacBody.toByteArray().size}' + BS + 'r' + BS + 'n' + Q),
              (Q + 'Connection: close' + CRLF + CRLF + Q, Q + 'Connection: close' + BS + 'r' + BS + 'n' + BS + 'r' + BS + 'n' + Q),
              (Q + 'HTTP/1.1 407 Proxy Authentication Required' + CRLF + Q, Q + 'HTTP/1.1 407 Proxy Authentication Required' + BS + 'r' + BS + 'n' + Q),
              (Q + 'Proxy-Authenticate: Basic realm=' + Q + 'NetShareProxy' + Q + CRLF + Q, Q + 'Proxy-Authenticate: Basic realm=' + BS + Q + 'NetShareProxy' + BS + Q + BS + 'r' + BS + 'n' + Q),
              (Q + 'HTTP/1.1 403 Forbidden' + CRLF + 'Connection: close' + CRLF + CRLF + Q, Q + 'HTTP/1.1 403 Forbidden' + BS + 'r' + BS + 'nConnection: close' + BS + 'r' + BS + 'n' + BS + 'r' + BS + 'n' + Q),
              (Q + 'HTTP/1.1 200 Connection Established' + CRLF + CRLF + Q, Q + 'HTTP/1.1 200 Connection Established' + BS + 'r' + BS + 'n' + BS + 'r' + BS + 'n' + Q),
          ]:
              assert old in s2, f'Missing: {old!r}'
              s2 = s2.replace(old, new)
          open(p2, 'w', encoding='utf-8', newline='').write(s2)
          PYEOF
          git config user.name "iamgptmax-png"
          git config user.email "iamgptmax-png@users.noreply.github.com"
          git add -A
          git commit -m "Fix unescaped newlines and quotes in MainActivity.kt and HttpProxyServer.kt"
          git push origin main
